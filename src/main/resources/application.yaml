spring:
  application:
    name: course-registration-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/course_registration}
    username: ${DB_USERNAME:course_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 스키마 변경은 Flyway가 담당하고 JPA는 매핑만 검증한다.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
