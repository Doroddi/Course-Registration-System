# Used only by the isolated measurement harness. Existing JWT security still applies.
management:
  server:
    address: 127.0.0.1
    port: ${DIAGNOSTICS_PORT:0}
  endpoints:
    web:
      exposure:
        include: prometheus
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    prometheus:
      access: read-only
  metrics:
    enable:
      all: true
    distribution:
      percentiles-histogram:
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true
  prometheus:
    metrics:
      export:
        enabled: true
