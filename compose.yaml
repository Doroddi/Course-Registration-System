name: course-registration-system
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: course_registration
      POSTGRES_USER: course_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_app -d course_registration"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
